[build]
builder = "nixpacks"

[build.env]
NIXPACKS_NODE_VERSION = "20"

[[build.phases.setup]]
cmds = ["npm install -g pnpm"]

[[build.phases.install]]
cmds = ["pnpm install --frozen-lockfile"]

[[build.phases.build]]
cmds = ["pnpm --filter @workspace/api-server build"]

[deploy]
startCommand = "node --enable-source-maps ./artifacts/api-server/dist/index.mjs"
